<!DOCTYPE html>
<html lang="es">
<head>
<!--
  ╔══════════════════════════════════════════════════════════════════╗
  ║  ZEROWASTE · Despensa inteligente y nutrición familiar          ║
  ║  ODS 2 (Hambre Cero) · ODS 3 (Salud y Bienestar)                ║
  ║  Archivo único: HTML + CSS + JavaScript puro (sin frameworks).   ║
  ║  Listo para abrir en el navegador o empaquetar como app híbrida ║
  ║  (Capacitor / Cordova) para Android e iOS.                      ║
  ╚══════════════════════════════════════════════════════════════════╝
  ÍNDICE DEL CÓDIGO (JavaScript)
   0. Configuración y constantes (CDN, paleta, iconos)
   1. Utilidades (fechas, formatos, HTML seguro)
   2. Base de datos local (localStorage) y estado
   3. Catálogo de alimentos + clasificador "IA" (ubicación/categoría)
   4. Recetario base + filtro nutricional médico
   5. Inventario: stock, conversiones, descuento al cocinar
   6. IA predictiva de consumo (ritmo del hogar)
   7. Motor del menú semanal
   8. Lista de compras (faltantes agrupados) + supermercados Chile
   9. Notificaciones
  10. Parser de fechas de vencimiento (OCR / manual, MM/AAAA → último día)
  11. Doble escáner continuo (código de barras → OCR fecha)
  12. Importador universal de recetas
  13. Pantallas (Home, Menú, Despensa, Recetas, Compras, Perfil)
  14. Hojas modales y formularios
  15. Onboarding (cuestionario inicial)
  16. Acciones (delegación de eventos) y arranque
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F7F3EA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ZeroWaste">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>ZeroWaste</title>
<style>
/* =====================================================================
   PALETA 60-30-10
   60% Hueso (fondo) · 30% Negro / Carob / Caramelo (texto y estructura)
   10% Acento #ff7a59 (botones principales, títulos clave, alertas)
   ===================================================================== */
:root{
  --bone:#F7F3EA;        /* 60% fondo principal (hueso / marfil) */
  --bone-card:#FBF8F1;   /* variante hueso para tarjetas */
  --black:#151210;       /* títulos y nombres destacados */
  --carob:#4B3A2F;       /* líneas divisorias y bordes */
  --line:rgba(75,58,47,.28);
  --caramel:#B0702E;     /* textos secundarios y etiquetas */
  --accent:#ff7a59;      /* 10% acento */
  --accent-soft:rgba(255,122,89,.12);
  --ok:#2FA866;          /* verde de confirmación del visor (fase fecha) */
  --radius:16px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bone)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--black);font-size:15px;line-height:1.4;
  overscroll-behavior:none;            /* sin "rebote" de navegador */
  -webkit-user-select:none;user-select:none; /* sensación de app nativa */
  -webkit-font-smoothing:antialiased;
}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:var(--black)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;width:22px;height:22px;flex-shrink:0}

/* ---------- Estructura principal ---------- */
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:calc(var(--safe-top) + 12px) 16px 12px;
  border-bottom:1px solid var(--line);background:var(--bone);
}
.topbar h1{font-size:20px;font-weight:800;letter-spacing:-.3px;flex:1}
.topbar h1 small{display:block;font-size:12px;font-weight:500;color:var(--caramel);letter-spacing:0}
.icon-btn{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.icon-btn:active{transform:scale(.94)}
.badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
  background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.avatar{width:42px;height:42px;border-radius:50%;border:1px solid var(--carob);overflow:hidden;display:grid;place-items:center;
  background:var(--bone-card);font-weight:700;color:var(--carob)}
.avatar img{width:100%;height:100%;object-fit:cover}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(96px + var(--safe-bottom))}

/* Barra de pestañas inferior (gestos táctiles, sin elementos de navegador) */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;
  max-width:560px;margin:0 auto;
  padding:8px 6px calc(8px + var(--safe-bottom));background:var(--bone);border-top:1px solid var(--line);z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--caramel);padding:4px 0}
.tab.active{color:var(--black);font-weight:700}
.tab.active svg{stroke:var(--accent)}

/* ---------- Tipografía y bloques ---------- */
.h-section{font-size:17px;font-weight:800;color:var(--accent);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
.h-section:first-child{margin-top:4px}
.h-section a,.link{font-size:13px;color:var(--caramel);font-weight:600}
.h-title{font-size:22px;font-weight:800;color:var(--black);letter-spacing:-.3px}
.sub{color:var(--caramel);font-size:13px}
.muted{color:var(--caramel);font-size:12px}
.card{background:var(--bone-card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card+.card{margin-top:10px}
.divider{height:1px;background:var(--line);margin:12px 0}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{font-weight:700;color:var(--black)}
.empty{text-align:center;padding:28px 12px;color:var(--caramel);font-size:14px}

/* Estadísticas */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;background:var(--bone-card)}
.stat b{display:block;font-size:22px;color:var(--black)}
.stat span{font-size:11px;color:var(--caramel)}
.stat.alert b{color:var(--accent)}
.stat.sel{border-color:var(--carob);box-shadow:inset 0 0 0 1px var(--carob)}

/* Accesos rápidos */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qbtn{border:1px solid var(--line);border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--bone-card);font-size:12px;font-weight:600;text-align:center}
.qbtn svg{width:26px;height:26px;stroke:var(--carob)}
.qbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.qbtn.primary svg{stroke:#fff}
.qbtn:active{transform:scale(.96)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:700;font-size:15px;
  border:1px solid var(--carob);color:var(--black);background:transparent}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1}

/* Chips / etiquetas */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 13px;border-radius:20px;border:1px solid var(--line);font-size:13px;color:var(--caramel);font-weight:600;background:var(--bone-card)}
.chip.on{border-color:var(--carob);color:var(--black);box-shadow:inset 0 0 0 1px var(--carob)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;border:1px solid var(--line);color:var(--caramel)}
.tag.warn{border-color:var(--accent);color:var(--accent)}
.tag.crit{background:var(--accent);border-color:var(--accent);color:#fff}

/* Elementos de lista */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .ico{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;flex-shrink:0;background:var(--bone)}
.days{text-align:right;font-size:12px;color:var(--caramel);flex-shrink:0}
.days b{display:block;font-size:16px;color:var(--black)}
.days.warn b,.days.crit b{color:var(--accent)}

/* Formularios */
label.f{display:block;font-size:12px;font-weight:700;color:var(--caramel);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.4px}
.input,select.input,textarea.input{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;outline:none}
.input:focus{border-color:var(--carob)}
textarea.input{min-height:120px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;margin-bottom:12px}
.search input{border:none;outline:none;padding:11px 0;flex:1;font-size:16px;background:transparent}
.search svg{stroke:var(--caramel);width:18px}
.check{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--carob);display:grid;place-items:center;flex-shrink:0}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.struck .name{text-decoration:line-through;color:var(--caramel)}
.toggle{width:48px;height:28px;border-radius:14px;border:1px solid var(--carob);position:relative;flex-shrink:0;background:var(--bone)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--carob);transition:.2s}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle.on::after{left:23px;background:#fff}
.stepper{display:flex;align-items:center;gap:18px;justify-content:center;margin:18px 0}
.stepper button{width:52px;height:52px;border-radius:50%;border:1px solid var(--carob);font-size:26px;font-weight:600}
.stepper b{font-size:40px;min-width:60px;text-align:center}

/* Calendario semanal */
.day{margin-bottom:12px}
.day-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.day-h b{font-size:16px}
.day-h.today b{color:var(--accent)}
.meal{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:none}
.meal .mlabel{width:78px;font-size:12px;color:var(--caramel);font-weight:700;flex-shrink:0}
.meal.done .name{text-decoration:line-through;color:var(--caramel)}

/* Recetas */
.recipe{display:flex;gap:12px;align-items:center}
.recipe .ico{width:52px;height:52px;border-radius:14px;font-size:26px}
.ing{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ing.miss span:first-child{color:var(--accent);font-weight:600}
.steps{counter-reset:s;list-style:none;margin-top:6px}
.steps li{counter-increment:s;padding:8px 0 8px 36px;position:relative;font-size:14px;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;border:1px solid var(--carob);
  display:grid;place-items:center;font-size:12px;font-weight:700}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 10px 10px 0;font-size:13px;margin:10px 0}
.star{font-size:22px;color:var(--caramel)}
.star.on{color:var(--accent)}

/* Supermercados */
.cart-panel{border-color:var(--carob)}
.sheet-foot{position:sticky;bottom:calc(-22px - var(--safe-bottom));margin:14px -18px calc(-22px - var(--safe-bottom));padding:12px 18px calc(14px + var(--safe-bottom));background:var(--bone);border-top:1px solid var(--line)}
.item.out .name,.item.out .muted{opacity:.55}
/* E. microcopy discreto y selección con acento */
.microcopy{font-size:11.5px;color:var(--caramel);margin:0 0 4px;line-height:1.3}
.chip.chip-pick.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:none}
/* A. aviso de estimación */
.warn-banner{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:11px 13px;font-size:13px;color:var(--black);margin-top:10px;line-height:1.45}
/* B. ficha de almacenamiento */
.tip-card{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bone-card)}
.tip-card b{display:block;font-size:13px;color:var(--black);margin-bottom:2px}
.tip-card p{font-size:13.5px;color:var(--carob);line-height:1.45}
.tip-ico{font-size:26px;line-height:1}
/* C. nutrición */
.nutri{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nutri div{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;background:var(--bone-card)}
.nutri b{display:block;font-size:17px;color:var(--black);font-variant-numeric:tabular-nums}
.nutri span{font-size:11px;color:var(--caramel)}
@media (max-width:360px){.nutri{grid-template-columns:repeat(2,1fr)}}
/* D. ícono pequeño en la lista de compras */
.mini-ico{font-size:20px;width:26px;text-align:center;flex-shrink:0}
.prog{height:8px;border-radius:4px;background:var(--line);margin-top:14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.cart-total{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--carob);border-radius:14px;padding:12px 14px;margin-top:12px}
.cart-total b:last-child{font-size:22px;color:var(--black)}
/* Pestañas de notificaciones */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:4px;background:var(--bone-card)}
.seg-b{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border-radius:11px;font-size:13px;font-weight:700;color:var(--caramel);text-align:center;line-height:1.2}
.seg-b.on{background:var(--bone);color:var(--black);box-shadow:inset 0 0 0 1px var(--carob)}
.seg-b .cnt{min-width:20px;height:20px;padding:0 6px;border-radius:10px;border:1px solid var(--line);font-size:11px;display:inline-grid;place-items:center;color:var(--caramel)}
.seg-b.on .cnt{border-color:var(--carob);color:var(--black)}
.seg-b .cnt.crit{background:var(--accent);border-color:var(--accent);color:#fff}
.n-group{font-size:13px;font-weight:800;color:var(--black);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.4px}
.n-group.crit{color:var(--accent)}
.n-group span{color:var(--caramel);font-weight:600}
.item .qty{font-size:14px;color:var(--black);white-space:nowrap}
.supers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.super{border:1px solid var(--carob);border-radius:14px;padding:12px;font-weight:800;text-align:center;background:var(--bone-card)}
.super small{display:block;font-weight:500;color:var(--caramel);font-size:11px}

/* ---------- Hoja modal inferior (bottom sheet) ---------- */
#backdrop{position:fixed;inset:0;background:rgba(21,18,16,.42);opacity:0;pointer-events:none;transition:.25s;z-index:40}
#backdrop.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:90%;overflow-y:auto;background:var(--bone);
  border-radius:22px 22px 0 0;border-top:1px solid var(--carob);padding:10px 18px calc(22px + var(--safe-bottom));
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:41}
#sheet.show{transform:none}
#sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
#sheet h2{font-size:20px;font-weight:800;margin-bottom:4px}

/* ---------- Escáner (pantalla completa) ---------- */
#scanner{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column;color:#fff}
#scanner.show{display:flex}
#scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-top{position:relative;z-index:2;padding:calc(var(--safe-top) + 14px) 16px 12px;background:linear-gradient(#000c,#0000)}
.scan-steps{display:flex;gap:6px;margin-bottom:10px}
.scan-steps i{flex:1;height:4px;border-radius:2px;background:#fff4}
.scan-steps i.on{background:var(--accent)}
.scan-top h3{font-size:19px}
.scan-top p{font-size:13px;opacity:.85}
/* Visor: cuadro de enfoque + línea láser animada (#ff7a59 → verde en fase fecha) */
.scan-frame{position:relative;z-index:2;margin:auto;width:80%;height:26%;border:3px solid var(--accent);border-radius:18px;
  box-shadow:0 0 0 2000px rgba(0,0,0,.38);transition:border-color .25s,height .25s}
.scan-frame.date{height:16%;border-color:var(--ok)}
.scan-frame::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;border-radius:2px;background:var(--accent);
  box-shadow:0 0 10px 2px var(--accent);animation:scanline 1.4s ease-in-out infinite}
.scan-frame.date::after{background:var(--ok);box-shadow:0 0 10px 2px var(--ok)}
.scan-frame.flash{animation:flash .6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 2000px rgba(47,168,102,.55)}100%{box-shadow:0 0 0 2000px rgba(0,0,0,.38)}}
.scan-beep{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);background:var(--ok);color:#fff;font-weight:900;
  font-size:18px;padding:10px 18px;border-radius:14px;opacity:0;transition:.2s;white-space:nowrap;z-index:3}
.scan-beep.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.scan-demo{display:none;max-height:34vh;overflow-y:auto;background:var(--bone);color:var(--black);border-radius:16px;padding:4px 12px;margin-bottom:10px}
.scan-demo.show{display:block}
.scan-demo button{display:flex;justify-content:space-between;width:100%;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.scan-demo button:last-child{border-bottom:none}
.scan-demo small{color:var(--caramel)}
#scanner:not(.nocam) .only-nocam{display:none}
/* Simulador: el envase se dibuja en un canvas en lugar del video */
#simCanvas{position:absolute;inset:0;width:100%;height:100%;display:none}
#scanner.sim #simCanvas{display:block}
#scanner.sim video,#scanner.sim .scan-nocam{display:none}
.sim-tag{display:none;margin-left:8px;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  background:var(--accent);color:#fff;padding:3px 8px;border-radius:8px;vertical-align:middle}
#scanner.sim .sim-tag{display:inline-block}
@keyframes scanline{0%,100%{transform:translateY(-38px)}50%{transform:translateY(38px)}}
.scan-frame.date::after{animation-name:scanlineSm}
@keyframes scanlineSm{0%,100%{transform:translateY(-20px)}50%{transform:translateY(20px)}}
@media (prefers-reduced-motion:reduce){.scan-frame::after{animation:none}}
.scan-bottom{position:relative;z-index:2;padding:14px 16px calc(18px + var(--safe-bottom));background:linear-gradient(#0000,#000d)}
.scan-status{font-size:14px;min-height:20px;margin-bottom:10px;text-align:center;line-height:1.35}
.scan-bottom .btn{border-color:#fff8;color:#fff}
.scan-bottom .btn.primary{border-color:var(--accent)}
.scan-manual{display:none;gap:8px;margin-bottom:10px}
.scan-manual.show{display:flex}
.scan-manual input{flex:1;padding:12px;border-radius:12px;border:none;font-size:16px}
.found{background:#fff;color:var(--black);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:13px;display:none}
.found.show{display:block}
.scan-nocam{display:none;position:relative;z-index:2;margin:auto;width:86%;max-width:380px;text-align:center;background:var(--bone);color:var(--black);
  border-radius:20px;padding:24px 18px;flex-direction:column;align-items:center;gap:10px}
.scan-nocam .big{font-size:46px;line-height:1}
.scan-nocam b{font-size:18px}
.scan-nocam p{font-size:13px;color:var(--caramel)}
#scanner.nocam .scan-nocam{display:flex}

/** Nutrición por porción de una receta (las cantidades de las recetas ya son por porción). */
function recipeNutrition(r){
  const t = { kcal:0, prot:0, carb:0, fat:0 }, missing = [];
  r.ing.forEach(([k, q, u, raw]) => {
    if (isStaple(k)) return;
    const n = NUTRI[k];
    if (!n){ missing.push(raw || catInfo(k, raw).name); return; }
    const g = conv(q, u, 'g', k);              // ml ≈ g para líquidos
    t.kcal += n[0] * g / 100; t.prot += n[1] * g / 100; t.carb += n[2] * g / 100; t.fat += n[3] * g / 100;
  });
  return { kcal: Math.round(t.kcal), prot: Math.round(t.prot), carb: Math.round(t.carb), fat: Math.round(t.fat), missing };
}

/** Carga un script externo una sola vez (para librerías de cámara/OCR). */
const _scripts = {};
function loadScript(url){
  if (_scripts[url]) return _scripts[url];
  _scripts[url] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = url; s.async = true;
    s.onload = res; s.onerror = () => { delete _scripts[url]; rej(new Error('No se pudo cargar ' + url)); };
    document.head.appendChild(s);
  });
  return _scripts[url];
}

/** Lee un archivo de imagen y lo reduce (para foto de perfil y OCR). */
function readImage(file, maxSize = 1600){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, maxSize / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c);
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return DEFAULT_STATE();
    return mergeDefaults(JSON.parse(raw));
  }catch(e){ return DEFAULT_STATE(); }
}
function mergeDefaults(obj){
  const d = DEFAULT_STATE();
  const out = Object.assign(d, obj);
  out.profile = Object.assign(DEFAULT_STATE().profile, obj.profile || {});
  out.settings = Object.assign(DEFAULT_STATE().settings, obj.settings || {});
  out.stats = Object.assign(DEFAULT_STATE().stats, obj.stats || {});
  return out;
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }

}

const CATALOG = {};
CATALOG_RAW.trim().split('\n').forEach(line => {
  const [key, name, cat, loc, unit, gPerU, days, flags, kws] = line.split('|');
  CATALOG[key] = { key, name, cat, loc, unit, gPerU:+gPerU || 0, days:+days, flags, kw: kws.split(',').map(norm) };

// Ingredientes básicos que se asumen siempre disponibles (no bloquean una receta).
const STAPLES = ['sal','pimienta','agua','oregano','comino','merken','canela','especias','perejil','cilantro','vinagre','hierbas'];

/**
 * "IA" de categorización: busca la palabra clave más específica (más larga)
 * presente en el texto (nombre + categorías de Open Food Facts).
 * Devuelve la entrada del catálogo o null.
 */
function classify(text){
  const t = ' ' + norm(text).replace(/[^a-z0-9ñ ]/g, ' ') + ' ';
  let best = null, len = 0;
  for (const c of Object.values(CATALOG)){
    for (const kw of c.kw){
      if (kw.length > len && new RegExp('[^a-z]' + kw.replace(/ /g, '\\s+')).test(t)){ best = c; len = kw.length; }
    }
  }
  return best;
}
/** Fallback con etiquetas de categorías de Open Food Facts. */
function classifyOFFTags(tags = []){
  const t = tags.join(' ');
  const r = (cat, loc) => ({ cat, loc });
  let res = r('Otros', 'Despensa');
  if (/dairies|milk|cheese|yogurt/.test(t)) res = r('Lácteos y derivados', 'Nevera');
  else if (/meat|poultry|fish|seafood|eggs/.test(t)) res = r('Proteínas', 'Nevera');
  else if (/legume|bean|lentil|chickpea/.test(t)) res = r('Legumbres', 'Despensa');
  else if (/cereal|pasta|bread|rice|flour/.test(t)) res = r('Carbohidratos', 'Despensa');
  else if (/fruit/.test(t)) res = r('Frutas', 'Despensa');
  else if (/vegetable/.test(t)) res = r('Verduras y Hortalizas', 'Nevera');
  if (/frozen/.test(t)) res.loc = 'Congelador';
  return res;
}
/**
 * Reglas explícitas por palabras clave (prioridad sobre el catálogo).
 * La primera regla con categoría que coincida define categoría + ubicación;
 * "congelado / helado" siempre fuerza la ubicación Congelador.
 */
const KEYWORD_RULES = [
  { re:/\b(leche|yogh?urt?|yogur|queso|quesillo|mantequilla|crema)/, cat:'Lácteos y derivados',   loc:'Nevera' },
  { re:/\b(carne|pollo|pechuga|trutro|vacuno|cerdo|pescado|salmon|merluza)/, cat:'Proteínas',     loc:'Nevera' },
  { re:/\b(verdura|lechuga|espinaca|acelga|brocoli|zanahoria)/, cat:'Verduras y Hortalizas',      loc:'Nevera' },
  { re:/\b(lenteja|poroto|garbanzo)/,                         cat:'Legumbres',                    loc:'Despensa' },
  { re:/\b(arroz|fideo|pasta|spaghetti|espagueti|tallarin|harina)/, cat:'Carbohidratos',          loc:'Despensa' },
  { re:/\b(atun|jurel|sardina)/,                             cat:'Proteínas',                    loc:'Despensa' },
  { re:/\b(aceite|conserva|tomate frito|salsa)/,              cat:'Otros',                        loc:'Despensa' }
];
/** Asigna clave, categoría y ubicación automáticamente a un producto. */
function autoCategorize(name, extraText = '', tags = []){
  const c = classify(name + ' ' + extraText);
  let cat = c ? c.cat : null, loc = c ? c.loc : null;
  if (!c){ const r = classifyOFFTags(tags); cat = r.cat; loc = r.loc; }
  const nn = norm(name);
  const rule = KEYWORD_RULES.find(r => r.re.test(nn));
  if (rule){ cat = rule.cat; loc = rule.loc; }
  const n = norm(name + ' ' + tags.join(' '));
  if (/congelad|frozen|helado/.test(n)) loc = 'Congelador';
  if (/lata|conserva|enlatad|uht|larga vida/.test(n) && loc === 'Nevera') loc = 'Despensa';
  return { key: c ? c.key : null, category: cat, location: loc, catalog: c };
}
function catInfo(key, fallbackName){
  if (CATALOG[key]) return CATALOG[key];
  return { key, name: fallbackName || String(key || '').replace(/^x:/, ''), cat:'Otros', loc:'Despensa', unit:'u', gPerU:100, days:7, flags:'', kw:[] };
}

/** Flags acumulados de una receta (según sus ingredientes). */
function recipeFlags(r){
  let f = r.extraFlags || '';
  r.ing.forEach(([k]) => f += catInfo(k).flags);
  return f;
}
/** ¿La receta respeta estrictamente las condiciones médicas del perfil? */
function recipeAllowed(r){
  const flags = recipeFlags(r);
  for (const cid of S.profile.conditions){
    const c = CONDITIONS.find(x => x.id === cid);
    if (c && [...c.ban].some(b => flags.includes(b))) return false;
  }
  // Restricciones personalizadas (texto libre separado por comas): "cilantro, pimentón"
  const words = S.profile.customRestrictions.split(',').map(norm).filter(w => w.length > 2);
  if (words.length){
    const text = norm(r.name + ' ' + r.ing.map(i => catInfo(i[0], i[3]).name + ' ' + (i[3] || '')).join(' '));
    if (words.some(w => text.includes(w))) return false;
  }
  return true;
}
/** Adapta los pasos según la condición (ej. hipertensión → sin sal). */
function adaptSteps(r){
  const c = S.profile.conditions;
  return r.steps.map(s => {
    if (c.includes('hipertension')) s = s.replace(/(con |y |una pizca de |a gusto)?\bsal\b( a gusto)?/gi, ' hierbas (sin sal) ').replace(/\s+/g, ' ');
    if (c.includes('diabetes')) s = s.replace(/\b(az[uú]car|miel)\b/gi, 'endulzante sin azúcar');
    return s.trim();
  });
}

/* =====================================================================
   5. INVENTARIO: STOCK, CONVERSIONES Y DESCUENTO AL COCINAR
   Unidades base: g · ml · u (líquidos: 1 ml ≈ 1 g)
   ===================================================================== */
/** Convierte una cantidad entre g/ml/u usando el peso por unidad del catálogo. */
function conv(q, from, to, key){
  if (from === to) return q;
  const g = from === 'u' ? q * (catInfo(key).gPerU || 100) : q;
  return to === 'u' ? g / (catInfo(key).gPerU || 100) : g;
}
/** Normaliza kg → g y L → ml. */
function normUnit(q, u){
  u = norm(u);
  if (u === 'kg') return [q * 1000, 'g'];
  if (u === 'l' || u === 'lt') return [q * 1000, 'ml'];
  if (u === 'g' || u === 'ml' || u === 'u') return [q, u];
  return [q, 'u'];
}
/** ¿El ítem de inventario corresponde a esta clave de ingrediente? */
function itemMatches(item, key){
  if (item.type === 'sobra') return false;
  if (key.startsWith('x:')) return norm(item.name).includes(key.slice(2));
  return item.key === key;
}
/** Stock disponible (no vencido) de un ingrediente, en la unidad indicada. */
function stockOf(key, unit){
  unit = unit || catInfo(key).unit;
  return S.inventory.filter(i => itemMatches(i, key) && daysUntil(i.expiry) >= 0)
    .reduce((a, i) => a + conv(i.qty, i.unit, unit, key), 0);
}
const isStaple = key => STAPLES.some(s => norm(key).replace(/^x:/, '') === s);
/** Disponibilidad de una receta para N porciones (opcionalmente con stock virtual). */
function recipeAvailability(r, portions = S.profile.people, virt = null){
  const rows = r.ing.map(([k, q, u, raw]) => {
    const need = q * portions;
    const have = virt ? conv(virt[k] ?? stockOf(k), catInfo(k).unit, u, k) : stockOf(k, u);
    const staple = isStaple(k);
    return { key:k, name: raw || catInfo(k, raw).name, need, unit:u, have, ok: staple || have >= need - 1e-6, staple };
  });
  const tracked = rows.filter(x => !x.staple);
  const okCount = tracked.filter(x => x.ok).length;
  return { rows, missing: tracked.filter(x => !x.ok), ratio: tracked.length ? okCount / tracked.length : 1, canCook: okCount === tracked.length };
}
/** Descuenta del inventario la cantidad usada (prioriza lo que vence antes). */
function deductIngredient(key, qty, unit){
  let remaining = qty, used = 0;
  const items = S.inventory.filter(i => itemMatches(i, key)).sort((a, b) => daysUntil(a.expiry) - daysUntil(b.expiry));
  for (const it of items){
    if (remaining <= 1e-6) break;
    const availInRecipeUnit = conv(it.qty, it.unit, unit, key);
    const take = Math.min(availInRecipeUnit, remaining);
    it.qty = +(it.qty - conv(take, unit, it.unit, key)).toFixed(3);
    remaining -= take; used += take;
    if (it.qty <= 0.01){ S.inventory = S.inventory.filter(x => x.id !== it.id); S.stats.consumed++; }
  }
  if (used > 0) logUse(key, conv(used, unit, catInfo(key).unit, key));
  return used;
}
/** Confirmación de "Cociné esta receta": resta exacto del stock. */
function cookRecipe(r, portions){
  const report = [];
  r.ing.forEach(([k, q, u, raw]) => {
    if (isStaple(k)) return;
    const used = deductIngredient(k, q * portions, u);
    if (used > 0) report.push(`${catInfo(k, raw).name} −${fmtQty(used, u)}`);
  });
  S.stats.cooked++;
  save();
  return report;
}
function addInventoryItem(data){
  const item = Object.assign({ id: uid(), addedAt: Date.now(), type:'producto', brand:'', barcode:'' }, data);
  S.inventory.push(item);
  if (item.key && item.type !== 'sobra'){
    (S.purchases[item.key] = S.purchases[item.key] || []).push(Date.now());
    S.purchases[item.key] = S.purchases[item.key].slice(-12);
  }
  save();
  return item;
}
/** Estado por fecha: vigente / próximo (<=3 días) / vencido. */
function status(item){
  const d = daysUntil(item.expiry);
  if (!item.expiry) return { id:'ok', label:'Sin fecha', cls:'' };
  if (d < 0) return { id:'exp', label:'Vencido', cls:'crit', d };
  if (d <= 3) return { id:'soon', label: d === 0 ? 'Vence hoy' : 'Próximo a vencer', cls:'warn', d };
  return { id:'ok', label:'Vigente', cls:'', d };
}
/** Formatea cantidades según la preferencia de unidades. */
function fmtQty(q, u){
  const r = (n, dec = 0) => (Math.round(n * 10 ** dec) / 10 ** dec).toLocaleString('es-CL');
  if (u === 'u') return `${r(q, q < 10 ? 1 : 0)} u`;
  if (S.settings.units === 'imperial'){
    return u === 'g' ? `${r(q / 28.35, 1)} oz` : `${r(q / 29.57, 1)} fl oz`;
  }
  if (q >= 1000) return `${r(q / 1000, 2)} ${u === 'g' ? 'kg' : 'L'}`;
  return `${r(q)} ${u}`;
}

/* =====================================================================
   6. IA PREDICTIVA DE CONSUMO PROACTIVO
   Aprende el ritmo del hogar con dos señales:
   a) Velocidad de consumo (cantidades descontadas por día).
   b) Ciclo de compra (cada cuántos días se vuelve a comprar el producto).
   Genera "Stock Bajo" ANTES de que se agote.
   ===================================================================== */
function logUse(key, amt){
  if (!key || amt <= 0) return;
  (S.consumption[key] = S.consumption[key] || []).push({ t: Date.now(), amt });
  S.consumption[key] = S.consumption[key].filter(e => Date.now() - e.t < 90 * DAY).slice(-60);
}
function consumptionModel(key){
  const log = (S.consumption[key] || []).filter(e => Date.now() - e.t < 60 * DAY);
  const buys = S.purchases[key] || [];
  let rate = 0, cycle = null;
  if (log.length){
    const span = Math.max(3, (Date.now() - log[0].t) / DAY);   // mínimo 3 días para no sobreestimar
    rate = log.reduce((a, e) => a + e.amt, 0) / span;            // unidades base por día
  }
  if (buys.length >= 2){
    const gaps = buys.slice(1).map((t, i) => (t - buys[i]) / DAY).filter(g => g >= 1);
    if (gaps.length) cycle = gaps.reduce((a, b) => a + b, 0) / gaps.length;
  }
  return { rate, cycle, lastBuy: buys[buys.length - 1] || null };
}
function predictions(){
  const out = [];
  const keys = new Set([...Object.keys(S.consumption), ...Object.keys(S.purchases)]);
  keys.forEach(key => {
    const info = catInfo(key); const m = consumptionModel(key);
    const stock = stockOf(key);
    let daysLeft = m.rate > 0 ? stock / m.rate : Infinity;
    let reason = m.rate > 0 ? `consumo ~${fmtQty(m.rate * 7, info.unit)}/semana` : '';
    if (m.cycle && m.lastBuy){
      const left = m.cycle - (Date.now() - m.lastBuy) / DAY;
      if (left < daysLeft){ daysLeft = left; reason = `lo compras cada ~${Math.round(m.cycle)} días`; }
    }
    if (daysLeft <= 3 && (m.rate > 0 || m.cycle)){
      const weekly = m.rate > 0 ? m.rate * 7 : (info.unit === 'u' ? 1 : 500);
      const buy = Math.max(weekly - stock, info.unit === 'u' ? 1 : 100);
      out.push({ key, name: info.name, stock, daysLeft: Math.max(0, daysLeft), qty: roundQty(buy, info.unit), unit: info.unit, reason });
    }
  });
  return out.sort((a, b) => a.daysLeft - b.daysLeft);
}
const roundQty = (q, u) => u === 'u' ? Math.ceil(q - 1e-6) : Math.ceil(q / 50) * 50;

/* =====================================================================
   7. MOTOR DEL MENÚ SEMANAL (7 días)
   Prioriza: sobras → alimentos por vencer → favoritas → stock disponible
   → preferencia nutricional, con variedad y filtro médico estricto.
   ===================================================================== */
const mealType = m => (m === 'Desayuno' || m === 'Once') ? 'D' : m === 'Colación' ? 'S' : 'A';
function scoreRecipe(r, ctx){
  const av = recipeAvailability(r, S.profile.people, ctx.virt);
  let s = av.ratio * 4;
  if (S.favorites.includes(r.id)) s += 3;
  if (r.main === S.profile.preference) s += 2;
  // Usa ingredientes que vencen pronto (antes del día planificado + 1)
  r.ing.forEach(([k]) => {
    if (S.inventory.some(i => itemMatches(i, k) && daysUntil(i.expiry) >= ctx.dayIndex && daysUntil(i.expiry) <= Math.max(3, ctx.dayIndex + 1))) s += 2.5;
  });
  const times = ctx.used[r.id] || 0;
  s -= times * 3;
  if (ctx.recent.includes(r.id)) s -= 6;
  return s + Math.random() * 1.2;
}
function candidatesFor(meal){
  const t = mealType(meal);
  return allRecipes().filter(r => r.meals.includes(t) && recipeAllowed(r));
}
function consumeVirt(virt, r){
  r.ing.forEach(([k, q, u]) => {
    if (isStaple(k)) return;
    const cur = virt[k] ?? stockOf(k);
    virt[k] = Math.max(0, cur - conv(q * S.profile.people, u, catInfo(k).unit, k));
  });
}
function generateMenu(keepDone = false){
  const start = todayISO();
  const ctx = { virt:{}, used:{}, recent:[], dayIndex:0 };
  const leftovers = S.inventory.filter(i => i.type === 'sobra' && daysUntil(i.expiry) >= 0).sort((a, b) => daysUntil(a.expiry) - daysUntil(b.expiry));
  const old = S.menu;
  const days = [];
  for (let d = 0; d < 7; d++){
    const date = addDays(start, d); ctx.dayIndex = d;
    const meals = {};
    for (const meal of S.profile.meals){
      const prev = keepDone && old && old.days.find(x => x.date === date)?.meals[meal];
      if (prev && prev.done){ meals[meal] = prev; continue; }
      // 1) Sobras primero en almuerzo/cena, antes de que caduquen
      if (mealType(meal) === 'A' && leftovers.length && daysUntil(leftovers[0].expiry) >= d){
        meals[meal] = { lo: leftovers.shift().id }; continue;
      }
      const cands = candidatesFor(meal);
      if (!cands.length){ meals[meal] = null; continue; }
      const best = cands.map(r => [r, scoreRecipe(r, ctx)]).sort((a, b) => b[1] - a[1])[0][0];
      meals[meal] = { r: best.id };
      ctx.used[best.id] = (ctx.used[best.id] || 0) + 1;
      ctx.recent = [...ctx.recent, best.id].slice(-4);
      consumeVirt(ctx.virt, best);
    }
    days.push({ date, meals });
  }
  S.menu = { start, days };
  save();
}
/** Si el menú quedó desactualizado (pasó la semana), avanza manteniendo lo pendiente. */
function ensureMenu(){
  if (!S.onboarded) return;
  if (!S.menu || !S.menu.days.length || daysUntil(S.menu.days[S.menu.days.length - 1].date) < 0 || daysUntil(S.menu.start) < -2){
    generateMenu(true);
  }
}
/** Coloca una sobra recién registrada en la próxima comida principal pendiente. */
function scheduleLeftover(item){
  if (!S.menu) return;
  for (const day of S.menu.days){
    if (daysUntil(day.date) < 0 || daysUntil(day.date) > daysUntil(item.expiry)) continue;
    for (const meal of S.profile.meals){
      if (mealType(meal) !== 'A') continue;
      const e = day.meals[meal];
      if (day.date === todayISO() && new Date().getHours() >= (meal === 'Almuerzo' ? 15 : 22)) continue;
      if (e && (e.done || e.lo)) continue;
      day.meals[meal] = { lo: item.id };
      save();
      return `${DOW[parseISO(day.date).getDay()]} · ${meal}`;
    }
  }
  return null;
}

/* =====================================================================
   8. LISTA DE COMPRAS + SUPERMERCADOS (CHILE)
   Une faltantes del menú + predicción de stock bajo + ítems manuales,
   agrupando por ingrediente sin duplicar.
   ===================================================================== */
function computeShopping(){
  const map = {};
  const add = (key, name, qty, unit, reason, recipe) => {
    const info = catInfo(key, name);
    const u = info.unit;
    const q = conv(qty, unit, u, key);
    if (!map[key]) map[key] = { key, name: info.name || name, qty:0, unit:u, cat: info.cat, reasons:[], recipes:[] };
    map[key].qty += q;
    if (reason && !map[key].reasons.includes(reason)) map[key].reasons.push(reason);
    if (recipe && !map[key].recipes.includes(recipe)) map[key].recipes.push(recipe);
  };
  // a) Menú planificado pendiente (desde hoy) contra stock virtual
  const virt = {};
  (S.menu?.days || []).forEach(day => {
    if (daysUntil(day.date) < 0) return;
    Object.values(day.meals).forEach(e => {
      if (!e || !e.r || e.done) return;
      const r = getRecipe(e.r); if (!r) return;
      r.ing.forEach(([k, q, u, raw]) => {
        if (isStaple(k)) return;
        const info = catInfo(k, raw);
        const need = conv(q * S.profile.people, u, info.unit, k);
        const have = virt[k] ?? stockOf(k);
        if (have < need) add(k, raw || info.name, need - have, info.unit, 'Menú', r.name);
        virt[k] = Math.max(0, have - need);
      });
    });
  });
  // b) IA predictiva
  predictions().forEach(p => { if (!map[p.key]) add(p.key, p.name, p.qty, p.unit, 'Stock bajo'); else if (!map[p.key].reasons.includes('Stock bajo')) map[p.key].reasons.push('Stock bajo'); });
  // c) Manuales
  S.shopping.forEach(m => add(m.key, m.name, m.qty, m.unit, 'Agregado'));
  return Object.values(map).map(x => ({ ...x, qty: roundQty(x.qty, x.unit) }))
    .sort((a, b) => CATEGORIES.indexOf(a.cat) - CATEGORIES.indexOf(b.cat) || a.name.localeCompare(b.name));
}

const clp = n => '$' + Math.round(n).toLocaleString('es-CL');
/** Elige para cada producto la opción con mejor equilibrio precio/calidad y totaliza por cadena. */
/**

/** Arma el carrito para cada cadena: precio real cuando existe, estimado si no. */
function optimizeCart(){
  const base = computeShopping().filter(x => !S.shopChecked[x.key]);
  const rowsFor = chain => base.map(x => {
    const info = catInfo(x.key, x.name);
    const rp = realProduct(chain, x.key);
    if (rp){
      const per = conv(rp.size, rp.sizeUnit, info.unit, x.key);   // cuánto trae un envase en la unidad del catálogo
      const packs = Math.max(1, Math.ceil(x.qty / Math.max(per, 1e-6) - 1e-6));
      return { ...x, real:true, product: rp.name, brand: rp.brand, url: rp.url, packs, unitPrice: rp.price, price: packs * rp.price, packLabel: fmtQty(rp.size, rp.sizeUnit) };
    }
    const [pack, price] = PRICE_REF[x.key] || [info.unit === 'u' ? 1 : 1000, 2000];
    const packs = Math.max(1, Math.ceil(x.qty / pack - 1e-6));
    const tier = TIERS[tierGroup(x.cat, x.key)].map(t => ({ ...t, score: t.q ** 3 / t.f })).sort((a, b) => b.score - a.score)[0];
    const up = Math.round(price * tier.f * (CHAIN_INDEX[chain] || 1) / 10) * 10;
    return { ...x, real:false, product: `${info.name} · ${tier.label}`, brand:'', url:null, packs, unitPrice: up, price: packs * up, packLabel: fmtQty(pack, info.unit) };
  });
  const byChain = {};
  const totals = SUPERMARKETS.map(s => {
    const rows = byChain[s.id] = rowsFor(s.id);
    const real = rows.filter(r => r.real).length;
    return { id: s.id, name: s.name, total: rows.reduce((a, r) => a + r.price, 0), real, n: rows.length, hasReal: real > 0 };
  }).sort((a, b) => (b.hasReal - a.hasReal) || a.total - b.total);
  return { byChain, totals, rows: byChain[totals[0]?.id] || [] };
}

/* =====================================================================
   10. PARSER DE FECHAS DE VENCIMIENTO
   Soporta: DD/MM/AAAA · DD-MM-AA · DD.MM.AAAA · AAAA-MM-DD · 12 ENE 2027
   · MM/AAAA y ENE 2027 → ÚLTIMO DÍA DEL MES. Corrige errores OCR (O→0, I→1).
   ===================================================================== */
const MONTHS = {ENE:1,JAN:1,FEB:2,MAR:3,ABR:4,APR:4,MAY:5,JUN:6,JUL:7,AGO:8,AUG:8,SEP:9,SET:9,OCT:10,NOV:11,DIC:12,DEC:12};
const MON_RE = 'ENE|JAN|FEB|MAR|ABR|APR|MAY|JUN|JUL|AGO|AUG|SEP|SET|OCT|NOV|DIC|DEC';
const fixYear = y => { y = +y; return y < 100 ? y + 2000 : y; };
const validYMD = (y, m, d) => m >= 1 && m <= 12 && y >= 2000 && y <= 2100 && d >= 1 && d <= lastDayOfMonth(y, m);
function parseExpiryText(raw){
  if (!raw) return null;
  let t = ' ' + String(raw).toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[|\\]/g, '/').replace(/\s+/g, ' ') + ' ';
  // Corrección OCR en tokens numéricos
  t = t.split(' ').map(tok => (/\d/.test(tok) && !new RegExp(MON_RE).test(tok)) ? tok.replace(/O/g, '0').replace(/[IL]/g, '1').replace(/B/g, '8') : tok).join(' ');
  const found = [];
  const push = (y, m, d, monthOnly) => {
    y = fixYear(y); m = +m;
    if (monthOnly) d = lastDayOfMonth(y, m);           // ← regla MM/AAAA = último día del mes
    d = +d;
    if (validYMD(y, m, d)) found.push({ iso: `${y}-${pad(m)}-${pad(d)}`, monthOnly });
  };
  const eat = (re, fn) => { t = t.replace(re, (...a) => { fn(...a); return ' # '; }); };
  eat(/(20\d{2})\s?[\/\-\.]\s?(\d{1,2})\s?[\/\-\.]\s?(\d{1,2})/g, (_, y, m, d) => push(y, m, d));
  eat(/(\d{1,2})\s?[\/\-\.]\s?(\d{1,2})\s?[\/\-\.]\s?(\d{4}|\d{2})(?!\d)/g, (_, d, m, y) => push(y, m, d));
  eat(new RegExp(`(\\d{1,2})\\s?[\\/\\-\\.]?\\s?(${MON_RE})[A-Z]*\\.?\\s?[\\/\\-\\.]?\\s?(\\d{4}|\\d{2})(?!\\d)`, 'g'), (_, d, mo, y) => push(y, MONTHS[mo], d));
  eat(new RegExp(`(${MON_RE})[A-Z]*\\.?\\s?[\\/\\-\\.]?\\s?(\\d{4}|\\d{2})(?!\\d)`, 'g'), (_, mo, y) => push(y, MONTHS[mo], 1, true));
  eat(/(?:^|[^\d])(\d{1,2})\s?[\/\-\.]\s?(20\d{2}|\d{2})(?!\d)/g, (_, m, y) => push(y, m, 1, true));
  // Formato compacto DDMMAAAA / DDMMAA (ej. 31122026)
  eat(/(?:^|[^\d])(\d{2})(\d{2})(20\d{2})(?!\d)/g, (_, d, m, y) => push(y, m, d));
  if (!found.length) return null;
  // Preferimos fechas plausibles (no muy antiguas) y la más lejana (vencimiento > elaboración)
  const plausible = found.filter(f => daysUntil(f.iso) > -400 && daysUntil(f.iso) < 365 * 6);
  const pool = plausible.length ? plausible : found;
  return pool.sort((a, b) => b.iso.localeCompare(a.iso))[0];
}

      if (c && /^\d{8,14}$/.test(c) && sim.tStart === my && scan.step === 1) return onBarcode(c);

function rrect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawSim(now){
  const cv = $('#simCanvas'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  if (!W) return;
  const k = W / (cv.clientWidth || 1);
  // Fondo: mesón de cocina con luz cálida
  const g = ctx.createRadialGradient(W / 2, H * .45, 10, W / 2, H * .5, Math.max(W, H) * .75);
  g.addColorStop(0, '#5a473a'); g.addColorStop(1, '#140f0c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,.035)'; ctx.lineWidth = 2 * k;
  for (let i = 0; i < 14; i++){
    const y = (i / 14) * H + (i * 37 % 23) * k;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.bezierCurveTo(W * .3, y + 20 * k, W * .6, y - 20 * k, W, y + 8 * k); ctx.stroke();
  }
  // Envase con leve movimiento de mano, acercamiento inicial y zoom a la fecha
  const pw = Math.min(W * .84, 380 * k), ph = pw * 1.25;
  const fr = frameRectPx(), fcx = fr.x + fr.w / 2, fcy = fr.y + fr.h / 2;
  const t = (now - sim.tStart) / 1000;
  const intro = easeIO(Math.min(1, t / .8));
  const tw = sim.phase === 2 ? easeIO(Math.min(1, (now - sim.tw0) / 700)) : 0;
  const bcY = ph * .6, dtY = ph * .88;
  const focusY = bcY + (dtY - bcY) * tw;
  const sc = (.8 + .2 * intro) * (1 + tw * .42);
  const jx = (Math.sin(t * 2.1) * 3 + Math.sin(t * 5.3) * 1.2) * k, jy = Math.cos(t * 1.7) * 3 * k;
  ctx.save();
  ctx.translate(fcx + jx, fcy + jy + (1 - intro) * 60 * k);
  ctx.rotate((1 - intro) * -.07 + Math.sin(t * 1.3) * .005);
  ctx.scale(sc, sc);
  ctx.translate(-pw / 2, -focusY);
  drawPackage(ctx, pw, ph, bcY, dtY);
  ctx.restore();
}
function drawPackage(ctx, pw, ph, bcY, dtY){
  const r = pw * .05, col = SIM_COLORS[sim.cat] || SIM_COLORS.Otros;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = pw * .08; ctx.shadowOffsetY = pw * .03;
  ctx.fillStyle = '#FBF8F1'; rrect(ctx, 0, 0, pw, ph, r); ctx.fill();
  ctx.restore();
  // Franja superior de color por categoría
  ctx.save(); rrect(ctx, 0, 0, pw, ph, r); ctx.clip();
  ctx.fillStyle = col; ctx.fillRect(0, 0, pw, ph * .34);
  ctx.restore();
  // Nombre del producto (hasta 2 líneas)
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'alphabetic';
  ctx.font = `800 ${Math.round(pw * .078)}px -apple-system, "Segoe UI", Roboto, Arial, sans-serif`;
  const words = sim.prod.name.split(' '), lines = []; let line = '';
  words.forEach(w => { const test = line ? line + ' ' + w : w; if (ctx.measureText(test).width > pw * .72 && line){ lines.push(line); line = w; } else line = test; });
  lines.push(line);
  lines.slice(0, 2).forEach((l, i) => ctx.fillText(l, pw * .07, ph * .12 + i * pw * .09));
  ctx.font = `600 ${Math.round(pw * .042)}px -apple-system, "Segoe UI", Roboto, Arial, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillText(sim.cat, pw * .07, ph * .3);
  ctx.font = `${Math.round(pw * .13)}px sans-serif`; ctx.textAlign = 'right';
  ctx.fillText(foodIcon(autoCategorize(sim.prod.name).key, sim.prod.name, sim.cat), pw * .94, ph * .15); ctx.textAlign = 'left';
  // Texto de envase
  ctx.fillStyle = '#4B3A2F'; ctx.font = `500 ${Math.round(pw * .036)}px -apple-system, "Segoe UI", Roboto, Arial, sans-serif`;
  ctx.fillText('Producto de Chile · Mantener en lugar fresco', pw * .07, ph * .41);
  // Código de barras EAN-13
  const bw = pw * .7, bh = ph * .21, bx = (pw - bw) / 2, by = bcY - bh / 2;
  ctx.fillStyle = '#fff'; ctx.fillRect(bx, by, bw, bh);
  const bits = eanBits(sim.code), quiet = bw * .07, mod = (bw - quiet * 2) / bits.length;
  ctx.fillStyle = '#000';
  for (let i = 0; i < bits.length; i++){
    if (bits[i] !== '1') continue;
    const guard = i < 3 || (i >= 45 && i < 50) || i >= 92;
    ctx.fillRect(bx + quiet + i * mod, by + bh * .08, mod + .4, bh * (guard ? .78 : .7));
  }
  ctx.font = `600 ${Math.round(bh * .14)}px "Courier New", monospace`; ctx.textAlign = 'center';
  const c = sim.code;
  ctx.fillText(c[0], bx + quiet * .5, by + bh * .94);
  ctx.fillText(c.slice(1, 7), bx + quiet + mod * 24, by + bh * .94);
  ctx.fillText(c.slice(7), bx + quiet + mod * 71, by + bh * .94);
  ctx.textAlign = 'left';
  // Etiqueta impresa con elaboración y vencimiento
  const lw = pw * .62, lh = ph * .11, lx = (pw - lw) / 2, ly = dtY - lh / 2;
  ctx.fillStyle = '#F1ECE1'; rrect(ctx, lx, ly, lw, lh, pw * .015); ctx.fill();
  ctx.setLineDash([pw * .012, pw * .01]); ctx.strokeStyle = 'rgba(75,58,47,.5)'; ctx.lineWidth = pw * .004; ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#1b1714'; ctx.font = `700 ${Math.round(pw * .046)}px "Courier New", monospace`; ctx.textAlign = 'center';
  ctx.fillText(sim.label.elab, pw / 2, ly + lh * .42);
  ctx.fillText(sim.label.venc, pw / 2, ly + lh * .84);
  ctx.textAlign = 'left';
}
const scan = { active:false, step:1, stream:null, timer:null, detector:null, zx:null, ocr:null, ocrBusy:false, code:'', product:null, productPromise:null, expiry:null, started:0 };

async function openScanner(){
  Object.assign(scan, { active:true, step:1, code:'', product:null, productPromise:null, expiry:null });
  $('#scanner').classList.add('show');
  $('#scanFound').classList.remove('show');
  $('#scanner').classList.remove('nocam');
  $('#scanDemo').classList.remove('show');
  scan.aiName = null;
  unlockAudio();                                // iOS: el audio debe activarse con un toque
  setScanStep(1);                               // 1) código de barras en vivo

}
function setScanStep(n){

  $('#scanFrame').classList.toggle('date', n === 2);

/** Textos del modo "sin cámara en vivo" según el paso. */

// Dentro de claude.ai la cámara en vivo está bloqueada: ir directo al modo foto
const EMBEDDED_VIEW = !!(window.claude && window.claude.use);
const scanStatus = msg => $('#scanStatus').textContent = msg;

async function startCamera(){
  stopCamera();
  if (EMBEDDED_VIEW || !navigator.mediaDevices?.getUserMedia){ setNoCam(true, 'Cámara en vivo bloqueada en esta vista. Usa "Producto" o "Escribir".'); return false; }
  try{
    scan.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } }, audio:false });
    const v = $('#scanVideo'); v.srcObject = scan.stream; await v.play().catch(() => {});
    setNoCam(false);
    // Enfoque continuo si el dispositivo lo soporta
    try{ const tr = scan.stream.getVideoTracks()[0]; const caps = tr.getCapabilities?.(); if (caps?.focusMode?.includes('continuous')) await tr.applyConstraints({ advanced:[{ focusMode:'continuous' }] }); }catch(e){}
    return true;
  }catch(e){
    setNoCam(true, e.name === 'NotAllowedError' ? 'Permiso de cámara denegado. Usa la foto o actívalo en Ajustes.' : 'No se pudo abrir la cámara en vivo. Usa la foto o "Escribir".');
    return false;
  }
}
function stopCamera(){
  clearTimeout(scan.timer);
  if (scan.stream){ scan.stream.getTracks().forEach(t => t.stop()); scan.stream = null; }
  const v = $('#scanVideo'); if (v) v.srcObject = null;
}
function closeScanner(){ scan.active = false; stopSim(); stopCamera(); $('#scanner').classList.remove('show'); }

/** Captura el cuadro central del video en un canvas (región del recuadro guía). */
function grabFrame(region = 'barcode'){
  const v = $('#scanVideo');
  if (!v.videoWidth) return null;
  const c = document.createElement('canvas');
  const w = v.videoWidth, h = v.videoHeight;
  const cw = Math.round(w * .8), ch = Math.round(h * (region === 'date' ? .28 : .45));
  c.width = cw; c.height = ch;
  c.getContext('2d', { willReadFrequently:true }).drawImage(v, (w - cw) / 2, (h - ch) / 2, cw, ch, 0, 0, cw, ch);
  return c;
}
/** Prepara el decodificador: nativo (Android/Chrome) o ZXing (iOS/otros). */
async function getBarcodeDecoder(){
  if ('BarcodeDetector' in window){
    try{
      const fmts = await BarcodeDetector.getSupportedFormats();
      if (fmts.includes('ean_13')){
        scan.detector = scan.detector || new BarcodeDetector({ formats: fmts.filter(f => /ean|upc|code_128|code_39|itf/.test(f)) });
        return async src => { const r = await scan.detector.detect(src); return r[0]?.rawValue || null; };
      }
    }catch(e){}
  }
  await loadScript(ZXING_URL);
  const Z = window.ZXing;
  if (!scan.zx){
    scan.zx = new Z.MultiFormatReader();
    const hints = new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128]);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    scan.zx.setHints(hints);
  }
  return async canvas => {
    try{
      const lum = new Z.HTMLCanvasElementLuminanceSource(canvas);
      return scan.zx.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(lum))).getText();
    }catch(e){ return null; }
  };
}
async function startBarcodeLoop(){
  let decode;
  try{ decode = await getBarcodeDecoder(); scanStatus('Buscando código de barras…'); }
  catch(e){ scanStatus('Lector no disponible sin conexión. Escribe el código con "Escribir" o elige "Producto".'); return; }
  const t0 = Date.now();
  const tick = async () => {
    if (!scan.active || scan.step !== 1) return;
    if (Date.now() - t0 > 15000) scanStatus('¿No lo detecta? Acerca o aleja el envase, mejora la luz o usa "Escribir".');
    const frame = grabFrame('barcode');
    if (frame){
      const code = await decode(frame).catch(() => null);
      if (code && /^\d{6,14}$/.test(code)) return onBarcode(code);
    }
    scan.timer = setTimeout(tick, 220);
  };
  tick();
}
/** Código detectado → consulta OFF en paralelo y reabre la cámara en modo OCR. */
async function onBarcode(code){
  if (scan.step !== 1) return;
  clearTimeout(scan.timer);
  beep(); vibrate(90);
  scan.code = code;
  scan.productPromise = lookupProduct(code).then(p => { scan.product = p; showFound(); return p; });
  showFound();
  setScanStep(2);                              // visor en VERDE: fase fecha
  flashBeep('BEEP ✓ Código leído');
  scanStatus('Apunta a la fecha de vencimiento');
  if (sim.on) return simPhase2();               // simulador: pasa a la fecha impresa
  // El video sigue transmitiendo: el OCR empieza al instante sobre el mismo stream
  if (scan.stream) startOcrLoop();
  else if (!$('#scanner').classList.contains('nocam')){ if (await startCamera()) startOcrLoop(); }
}
function showFound(){
  const f = $('#scanFound'); f.classList.add('show');
  const p = scan.product;
  f.innerHTML = p ? `<b>${esc(p.name || 'Producto no registrado')}</b><br><span class="muted">${esc([p.category, p.location, p.source].filter(Boolean).join(' · '))}</span>`
                  : `<b>Código ${esc(scan.code)}</b><br><span class="muted">Buscando producto…</span>`;
}
/** Consulta Open Food Facts y categoriza automáticamente. */
async function lookupProduct(code){
  const base = { barcode: code, name:'', brand:'', qty:1, unit:'u' };
  // 1) Productos que ya confirmaste antes con este código
  const learned = S.barcodes?.[code];
  if (learned) return { ...base, ...learned, found:true, source:'Tu base de productos' };
  // 2) Diccionario local (sin red)
  const local = LOCAL_PRODUCTS[code];
  if (local){
    const ac = autoCategorize(local.name);
    return { ...base, name: local.name, key: ac.key, category: ac.category, location: ac.location, qty: local.qty, unit: local.unit, found:true, source:'Diccionario local' };
  }
  // 3) Open Food Facts
  try{
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 6000);
    const res = await fetch(`${OFF_API}${encodeURIComponent(code)}.json?fields=product_name,product_name_es,generic_name_es,brands,categories_tags,quantity,product_quantity`, { signal: ctrl.signal });
    clearTimeout(to);
    const j = await res.json();
    if (j.status === 1 && j.product){
      const p = j.product;
      const name = p.product_name_es || p.product_name || p.generic_name_es || '';
      const tags = p.categories_tags || [];
      const ac = autoCategorize(name, '', tags);
      const [q, u] = parseQtyString(p.quantity, p.product_quantity, ac.key);
      if (name) return { ...base, name, brand: (p.brands || '').split(',')[0].trim(), key: ac.key, category: ac.category, location: ac.location, qty:q, unit:u, found:true, source:'Open Food Facts' };
    }
  }catch(e){}
  return { ...base, key:null, category:'Otros', location:'Despensa', found:false, source:'No registrado: escribe el nombre' };
}
/** "1 L", "500 g", "6 x 125 g" → [cantidad, unidad base] */
function parseQtyString(str, num, key){
  const s = norm(str || '');
  const m = s.match(/(?:(\d+)\s*x\s*)?(\d+(?:[.,]\d+)?)\s*(kg|g|gr|ml|cl|l|lt|un|u)\b/);
  if (m){
    const mult = +(m[1] || 1); let q = parseFloat(m[2].replace(',', '.')) * mult; let u = m[3];
    if (u === 'cl'){ q *= 10; u = 'ml'; } if (u === 'gr') u = 'g'; if (u === 'un') u = 'u';
    let [qq, uu] = normUnit(q, u);
    const catU = key ? catInfo(key).unit : null;
    if (catU === 'u' && uu !== 'u' && m[1]) return [mult, 'u'];   // ej. pack de 6 yogures
    return [qq, uu];
  }
  if (num) return [+num, 'g'];
  return [1, 'u'];
}
/** Paso 2: OCR continuo de la fecha. */
async function startOcrLoop(){
  scanStatus('Cargando lector de texto (OCR)…');
  try{
    await loadScript(TESSERACT_URL);
    if (!scan.ocr){
      scan.ocr = await Tesseract.createWorker('eng');
      // Solo caracteres útiles para fechas: dígitos, separadores y letras de meses / "VENC"
      await scan.ocr.setParameters({ tessedit_char_whitelist:'0123456789/-.: ABCDEFGHIJKLMNOPQRSTUVWXYZ', tessedit_pageseg_mode:'6' }).catch(() => {});
    }
  }catch(e){ scanStatus('OCR no disponible sin conexión. Escribe la fecha con "Escribir".'); $('#scanManual').classList.add('show'); return; }
  if (!scan.active || scan.step !== 2) return;
  scanStatus('Apunta a la fecha de vencimiento · leyendo…');
  scan.started = Date.now();
  const tick = async () => {
    if (!scan.active || scan.step !== 2) return;
    if (!scan.ocrBusy){
      const frame = grabFrame('date');
      if (frame){
        scan.ocrBusy = true;
        try{
          const { data } = await scan.ocr.recognize(preprocess(frame));
          const d = parseExpiryText(data.text);
          // En vivo solo aceptamos fechas plausibles (no más de 60 días vencidas)
          if (d && daysUntil(d.iso) >= -60 && scan.active && scan.step === 2) { scan.ocrBusy = false; return onExpiry(d); }
          if (data.text.trim()) scanStatus('Apunta a la fecha · leyendo "' + data.text.trim().slice(0, 26).replace(/\s+/g, ' ') + '"');
        }catch(e){}
        scan.ocrBusy = false;
      }
    }
    if (Date.now() - scan.started > 20000){ scanStatus('No se detecta la fecha. Acércate, evita reflejos o escríbela abajo.'); $('#scanManual').classList.add('show'); }
    scan.timer = setTimeout(tick, 450);
  };
  tick();
}
/**
 * Pre-procesamiento con Canvas para texto impreso:
 * 1) escala ×2 si el recorte es pequeño · 2) escala de grises
 * 3) estiramiento de histograma (contraste) · 4) inversión si el fondo es oscuro
 *    (fechas impresas en blanco / láser sobre envases oscuros).
 */
function preprocess(src){
  const k = src.width < 1100 ? 2 : 1;
  const c = document.createElement('canvas'); c.width = src.width * k; c.height = src.height * k;
  const ctx = c.getContext('2d', { willReadFrequently:true });
  ctx.imageSmoothingQuality = 'high'; ctx.drawImage(src, 0, 0, c.width, c.height);
  const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data;
  const hist = new Uint32Array(256); let sum = 0;
  for (let i = 0; i < d.length; i += 4){
    const g = (.299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2]) | 0;
    d[i] = g; hist[g]++; sum += g;
  }
  const n = d.length / 4, mean = sum / n;
  // percentiles 2% y 98% para ignorar brillos y sombras extremas
  let lo = 0, hi = 255, acc = 0;
  for (let v = 0; v < 256; v++){ acc += hist[v]; if (acc > n * .02){ lo = v; break; } }
  acc = 0; for (let v = 255; v >= 0; v--){ acc += hist[v]; if (acc > n * .02){ hi = v; break; } }
  const range = Math.max(1, hi - lo), invert = mean < 110;
  for (let i = 0; i < d.length; i += 4){
    let g = (d[i] - lo) * 255 / range;
    g = (g - 128) * 1.35 + 128;                 // contraste extra
    g = Math.max(0, Math.min(255, g));
    if (invert) g = 255 - g;
    d[i] = d[i + 1] = d[i + 2] = g;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}
async function onExpiry(d){
  if (!scan.active) return;
  beep(1800, 160); vibrate([60, 40, 60]);
  scan.expiry = d;
  clearTimeout(scan.timer);
  flashBeep('Fecha ' + fmtDM(d.iso));
  scanStatus(`Fecha detectada: ${fmtDM(d.iso)}${d.monthOnly ? ' (último día del mes)' : ''} ✓`);
  await new Promise(r => setTimeout(r, 450));   // deja ver la confirmación
  await finishScan();
}
/** Fin del flujo continuo: abre el formulario prellenado para confirmar. */
async function finishScan(){
  stopCamera();
  const p = scan.productPromise ? await scan.productPromise : null;
  const code = scan.code, exp = scan.expiry;
  closeScanner();
  const name = p?.name || scan.aiName || '';
  const ac = !p?.key && name ? autoCategorize(name) : null;
  const info = p?.key ? catInfo(p.key) : ac?.catalog || null;
  openItemForm({
    name, brand: p?.brand || '', barcode: code, key: p?.key || ac?.key || null,
    category: p?.category || ac?.category || 'Otros', location: p?.location || ac?.location || 'Despensa',
    qty: p?.qty || (info && info.unit !== 'u' ? 1000 : 1), unit: p?.unit || info?.unit || 'u',
    expiry: exp ? exp.iso : (info ? addDays(todayISO(), info.days) : ''),
    _monthOnly: exp?.monthOnly, _found: p?.found, _estimated: !exp, _scanned: !!exp,
    _quick: true, _source: p?.source || (scan.aiName ? 'Leído por IA' : '')
  });
}
/**
 * Lee la fecha de vencimiento de una foto con Claude (dentro de claude.ai,
 * capacidad "sample" con imágenes). Devuelve {fecha:{iso,monthOnly}|null, producto, raw}
 * o lanza {code} con el motivo. Devuelve null si la IA no está disponible en esta vista.
 */
async function readDateWithClaude(file, canvas){
  const sample = window.claude?.use ? await window.claude.use('sample').catch(() => null) : null;
  if (!sample) return null;
  const lim = await sample.limits().catch(() => null);
  if (!lim?.images) throw { code:'images_unavailable' };
  // Se envía la foto original si el formato es aceptado; si no, una copia JPEG reducida
  let img = file;
  const okType = lim.images.mediaTypes?.includes(file.type);
  const okSize = !lim.images.maxInputBytes || file.size <= lim.images.maxInputBytes;
  if ((!okType || !okSize) && canvas) img = await new Promise(r => canvas.toBlob(r, 'image/jpeg', .9));
  if (!img) throw { code:'image_rejected' };
  const prompt =
    'Esta imagen es una foto del envase de un alimento comprado en Chile. ' +
    'Busca la FECHA DE VENCIMIENTO (puede decir VENC, VENCE, VTO, F.V., FECHA DE VENCIMIENTO, EXP, ' +
    'CONSUMIR ANTES DE, CONSUMIR PREFERENTEMENTE ANTES DE, BB, o aparecer sola). ' +
    'Ignora la fecha de elaboración o envasado (ELAB, FAB, F.E., ENV). En Chile el orden es día/mes/año. ' +
    'Responde exactamente con dos líneas y nada más:\n' +
    'FECHA: DD/MM/AAAA  (o MM/AAAA si solo se ve mes y año, o NINGUNA si no se ve)\n' +
    'PRODUCTO: nombre corto del alimento si se lee en el envase, o NINGUNO';
  const { text } = await sample(prompt, { images: img });
  const fLine = (text.match(/FECHA\s*:\s*(.+)/i) || [])[1] || text;
  const pLine = ((text.match(/PRODUCTO\s*:\s*(.+)/i) || [])[1] || '').trim();
  return {
    fecha: /NINGUNA/i.test(fLine) ? null : parseExpiryText(fLine),
    producto: pLine && !/^NINGUNO/i.test(pLine) ? pLine.replace(/[.*"]/g, '').slice(0, 60) : null,
    raw: text
  };
}

/** Escaneo desde foto (si no hay acceso a video en vivo). */
async function scanFromPhoto(file){
  const showManual = () => $('#scanManual').classList.add('show');
  let canvas = null;
  try{ canvas = await readImage(file, 1800); }catch(e){ /* p.ej. HEIC: se envía el archivo original */ }
  if (scan.step === 1){
    try{
      scanStatus('Analizando foto…');
      const decode = await getBarcodeDecoder();
      const code = canvas ? await decode(canvas) : null;
      if (code) return onBarcode(code);
      scanStatus('No se encontró código en la foto. Intenta de nuevo o usa "Escribir".');
    }catch(e){ scanStatus('No se pudo analizar la foto. Usa "Escribir".'); }
    return;
  }
  // a) IA de Claude (dentro de claude.ai)
  if (EMBEDDED_VIEW){
    scanStatus('Leyendo la fecha con IA… (puede tardar unos segundos)');
    $('#noCamBtn').disabled = true;
    try{
      const ai = await readDateWithClaude(file, canvas);
      if (ai === null){ scanStatus('La IA no está disponible en esta vista. Escribe la fecha abajo.'); return showManual(); }
      if (ai.fecha){ scan.aiName = ai.producto; return onExpiry(ai.fecha); }
      scanStatus('No se ve la fecha en la foto. Acércate a la fecha impresa, con buena luz, y vuelve a intentar.');
      showManual();
    }catch(err){ scanStatus(aiErrorMessage(err?.code)); showManual(); }
    finally{ $('#noCamBtn').disabled = false; }
    return;
  }
  // b) OCR local (Tesseract) fuera de claude.ai
  try{
    if (!canvas) throw new Error('img');
    scanStatus('Leyendo fecha en la foto…');
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 20000));
    await Promise.race([loadScript(TESSERACT_URL), timeout]);
    if (!scan.ocr) scan.ocr = await Promise.race([Tesseract.createWorker('eng'), timeout]);
    const { data } = await scan.ocr.recognize(preprocess(canvas));
    const d = parseExpiryText(data.text);
    if (d) return onExpiry(d);
    scanStatus('No se detectó la fecha en la foto. Escríbela abajo.'); showManual();
  }catch(e){ scanStatus('No se pudo leer la fecha de la foto. Escríbela abajo.'); showManual(); }
}

/* =====================================================================
   12. IMPORTADOR UNIVERSAL DE RECETAS
   - Enlaces de blogs: intenta leer el JSON-LD "Recipe" del sitio.
   - TikTok: oEmbed público (título/caption).
   - Instagram/otros bloqueados por CORS: se pide pegar el texto del post.
   - Foto de libro: OCR (Tesseract, español).
   Luego la IA local extrae ingredientes/cantidades y pasos.
   ===================================================================== */
const UNIT_WORDS = [
  [/^(kg|kilos?|kilogramos?)$/, 1000, 'g'], [/^(g|gr|grs|gramos?)$/, 1, 'g'],
  [/^(l|lt|lts|litros?)$/, 1000, 'ml'], [/^(ml|cc|mililitros?)$/, 1, 'ml'],
  [/^(tazas?|tz)$/, 240, 'ml'], [/^(cdas?|cucharadas?)$/, 15, 'ml'], [/^(cdtas?|cditas?|cucharaditas?)$/, 5, 'ml'],
  [/^(u|un|unid|unidades?|piezas?|dientes?|latas?|tarros?|paquetes?)$/, 1, 'u']
];
const FRACTIONS = { '½':.5, '¼':.25, '¾':.75, '⅓':.333, '⅔':.667 };
function parseNumber(s){
  s = s.replace(/[½¼¾⅓⅔]/g, m => ' ' + FRACTIONS[m]).trim();
  const parts = s.split(/\s+/); let total = 0;
  parts.forEach(p => { if (/^\d+\/\d+$/.test(p)){ const [a, b] = p.split('/'); total += a / b; } else total += parseFloat(p.replace(',', '.')) || 0; });
  return total;
}
function parseIngredientLine(line){
  let l = line.replace(/^[\s\-•*·▪️✅👉🔸]+/u, '').trim();
  if (!l || l.length > 90) return null;
  const m = l.match(/^((?:\d+[.,]?\d*|\d+\/\d+|[½¼¾⅓⅔])(?:\s+(?:\d+\/\d+|[½¼¾⅓⅔]))?)\s*([a-zA-Záéíóú.]+)?\s*(?:de\s+)?(.*)$/);
  let q = 1, u = 'u', name = l;
  if (m){
    q = parseNumber(m[1]) || 1;
    const uw = norm((m[2] || '').replace('.', ''));
    const unit = UNIT_WORDS.find(([re]) => re.test(uw));
    if (unit){ q *= unit[1]; u = unit[2]; name = m[3]; }
    else { name = ((m[2] || '') + ' ' + (m[3] || '')).trim(); }
  }
  name = name.replace(/\(.*?\)/g, '').replace(/,.*$/, '').trim();
  if (!name) return null;
  const c = classify(name);
  const key = c ? c.key : (STAPLES.includes(norm(name)) ? norm(name) : 'x:' + norm(name).split(' ').slice(0, 2).join(' '));
  if (c && u !== 'u' && c.unit === 'u' && !c.gPerU) u = c.unit;
  return [key, q, u, c ? null : cap(name)];
}
/** Convierte texto libre en una receta estructurada. */
function parseRecipeText(text, fallbackTitle = 'Receta importada', source = ''){
  const lines = String(text).split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  let title = fallbackTitle, mode = 'auto', ing = [], steps = [], portions = 4;
  lines.forEach((l, idx) => {
    const n = norm(l);
    const pm = n.match(/(\d+)\s*(porciones|personas|raciones|comensales)/); if (pm){ portions = +pm[1] || 4; if (l.length < 40) return; }
    if (/^ingredientes?\b/.test(n)){ mode = 'ing'; return; }
    if (/^(preparacion|pasos?|procedimiento|instrucciones|elaboracion|modo de preparacion)\b/.test(n)){ mode = 'steps'; return; }
    if (idx === 0 && !/^\d/.test(l) && l.length < 70 && title === fallbackTitle){ title = l.replace(/[#*]/g, '').trim(); return; }
    const looksIng = /^[\-•*·]?\s*(\d|[½¼¾⅓⅔])/.test(l) && l.length < 80 && !/^\d+[\.\)]\s+[A-ZÁÉÍÓÚa-z]{4,}.{40,}/.test(l);
    const looksStep = /^\d+[\.\)]\s/.test(l) || l.length > 60;
    if (mode === 'ing' || (mode === 'auto' && looksIng && !looksStep)){
      const p = parseIngredientLine(l); if (p) ing.push(p);
    } else if (mode === 'steps' || looksStep){
      steps.push(l.replace(/^\d+[\.\)]\s*/, ''));
    }
  });
  // Normaliza a cantidades POR PORCIÓN
  ing = ing.map(([k, q, u, raw]) => [k, +(q / portions).toFixed(2), u, raw]);
  if (!steps.length) steps = ['Sigue las indicaciones de la fuente original.'];
  const mains = { proteinas: ['pollo','carne','cerdo','pescado','atun','huevo','tofu'], legumbres: ['lentejas','porotos','garbanzos','arvejas'], carbohidratos: ['arroz','fideos','pan','papa','quinoa','harina'] };
  let main = 'equilibrado';
  for (const [k, list] of Object.entries(mains)) if (ing.some(i => list.includes(i[0]))) { main = k; break; }
  const isBreakfast = /desayuno|batido|panqueque|avena|tostada|once|smoothie/.test(norm(title));
  return { id: 'imp_' + uid(), e:'📥', name: cap(title).slice(0, 80), meals: isBreakfast ? ['D'] : ['A'], main, time: 30, ing, steps, imported: true, source };
}
async function importFromUrl(url){
  url = url.trim();
  if (!/^https?:\/\//.test(url)) throw new Error('Enlace no válido');
  // TikTok: oEmbed público con el caption
  if (/tiktok\.com/.test(url)){
    const r = await fetch('https://www.tiktok.com/oembed?url=' + encodeURIComponent(url));
    const j = await r.json();
    if (j.title) return parseRecipeText(j.title.replace(/#\S+/g, '').replace(/\s{2,}/g, '\n'), j.author_name ? `Receta de ${j.author_name}` : 'Receta de TikTok', url);
  }
  // Blogs: JSON-LD schema.org/Recipe (solo si el sitio permite CORS)
  const res = await fetch(url);
  const html = await res.text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  for (const s of doc.querySelectorAll('script[type="application/ld+json"]')){
    try{
      let data = JSON.parse(s.textContent);
      const flat = [].concat(data['@graph'] || data);
      const rec = flat.find(x => [].concat(x['@type']).includes('Recipe'));
      if (rec){
        const steps = [].concat(rec.recipeInstructions || []).map(x => typeof x === 'string' ? x : x.text).filter(Boolean);
        const yieldN = parseInt([].concat(rec.recipeYield || '4')[0]) || 4;
        const text = [rec.name, `${yieldN} porciones`, 'Ingredientes', ...[].concat(rec.recipeIngredient || []), 'Preparación', ...steps].join('\n');
        return parseRecipeText(text, rec.name, url);
      }
    }catch(e){}
  }
  const t = doc.querySelector('meta[property="og:description"]')?.content || doc.body?.innerText?.slice(0, 4000) || '';
  return parseRecipeText(t, doc.title || 'Receta importada', url);
}

    if (tab === 'can') list = all.filter(r => recipeAvailability(r).canCook);

    if (tab === 'fav') list = all.filter(r => S.favorites.includes(r.id));
    if (tab === 'imp') list = S.recipesImported;
    const hidden = allRecipes().length - all.length;
    return `
      <div class="chips" style="margin-bottom:12px">
        ${[['can','Con lo que tengo'],['all','Todas'],['fav','★ Favoritas'],['imp','Importadas']].map(([id, l]) => `<button class="chip ${tab === id ? 'on' : ''}" data-act="recipeTab" data-t="${id}">${l}</button>`).join('')}

function openSheet(html){ $('#sheetBody').innerHTML = html; $('#sheet').classList.add('show'); $('#backdrop').classList.add('show'); $('#sheet').scrollTop = 0; }
function closeSheet(){ $('#sheet').classList.remove('show'); $('#backdrop').classList.remove('show'); if (current === 'shop' && S.onboarded) render(); }
/** Diálogo de confirmación personalizado (estilo nativo). */
function ask(title, text, buttons){
  return new Promise(res => {
    openSheet(`<h2>${esc(title)}</h2><p class="sub" style="margin-bottom:16px">${esc(text)}</p>
      <div style="display:grid;gap:8px">${buttons.map((b, i) => `<button class="btn block ${b.primary ? 'primary' : ''}" data-ask="${i}">${esc(b.label)}</button>`).join('')}</div>`);
    $('#sheetBody').querySelectorAll('[data-ask]').forEach(el => el.onclick = () => { closeSheet(); res(buttons[+el.dataset.ask].value); });
  });
}

      <input type="date" id="fExpDate" class="input" style="width:52px;padding:10px 4px" value="${it.expiry || ''}"></div>
    <div class="muted" id="fExpHint" style="margin-top:4px">${it._scanned ? 'Fecha escaneada ✓ ' : ''}${it._monthOnly ? 'Detectado solo mes/año → se registró el último día del mes.' : it._estimated && it.expiry ? 'Fecha estimada según el tipo de alimento. Ajústala si es necesario.' : ''}</div>
    <button class="btn primary block" style="margin-top:16px" data-act="saveItem" data-id="${editId || ''}" data-type="${it.type}" data-barcode="${esc(it.barcode)}">${it._quick ? 'Guardar en inventario' : 'Guardar Cambios'}</button>

  };

  };

function saveItemFromForm(editId, type, barcode, next = false){
  const name = $('#fName').value.trim();
  if (!name) return toast('Escribe el nombre del alimento');
  const parsed = parseExpiryText($('#fExpText').value) || ($('#fExpDate').value ? { iso: $('#fExpDate').value } : null);
  let [qty, unit] = normUnit(parseFloat($('#fQty').value) || 1, $('#fUnit').value);
  const ac = autoCategorize(name);
  const data = { name, brand: $('#fBrand')?.value.trim() || '', category: $('#fCat').value, location: $('#fLoc').value, qty, unit,
                 expiry: parsed ? parsed.iso : '', key: type === 'sobra' ? null : ac.key, type, barcode };
  if (editId){
    const it = S.inventory.find(i => i.id === editId);
    if (it){
      const before = conv(it.qty, it.unit, catInfo(it.key).unit, it.key);
      Object.assign(it, data);
      const after = conv(it.qty, it.unit, catInfo(it.key).unit, it.key);
      if (it.key && after < before) logUse(it.key, before - after);  // la IA aprende de ajustes manuales
    }
    save(); closeSheet(); toast('Cambios guardados'); render();
  }else{
    const item = addInventoryItem(data);
    // Aprende el código de barras → la próxima vez el producto se reconoce al instante
    if (barcode && type !== 'sobra'){ S.barcodes[barcode] = { name, brand: data.brand, key: data.key, category: data.category, location: data.location, qty, unit }; save(); }
    closeSheet();
    if (next){ toast(`${name} guardado ✓ · ${storageTip(data.key, data.category, type)}`); render(); return openScanner(); }
    let extra = '';
    if (type === 'sobra'){ const slot = scheduleLeftover(item); extra = slot ? `Programadas para ${slot}.` : ''; }
    render();
    showStorageCard([item], extra);
  }
}

/** Hoja de edición de una comida del menú. */
function openMealSheet(date, meal){
  const day = S.menu.days.find(d => d.date === date); if (!day) return;
  const e = day.meals[meal];
  const r = e?.r ? getRecipe(e.r) : null;
  const ctx = { virt:{}, used:{}, recent:[], dayIndex: daysUntil(date) };
  const cands = candidatesFor(meal).map(x => [x, scoreRecipe(x, ctx)]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  openSheet(`
    <div class="muted">${DOW[parseISO(date).getDay()]} ${fmtDM(date)} · ${esc(meal)}</div>
    <h2>${esc(recipeName(e))}</h2>
    <div class="btn-row" style="margin:12px 0">
      ${r ? `<button class="btn primary sm" data-act="openRecipe" data-id="${r.id}">Ver receta</button>` : ''}
      ${e?.lo ? `<button class="btn primary sm" data-act="eatLeftover" data-date="${date}" data-meal="${esc(meal)}">Comí las sobras</button>` : ''}
      <button class="btn sm" data-act="autoSwap" data-date="${date}" data-meal="${esc(meal)}">Sugerir otra</button>
      <button class="btn sm" data-act="clearMeal" data-date="${date}" data-meal="${esc(meal)}">Vaciar</button>
    </div>
    <div class="h-section">Sustituir por</div>
    <div class="card">${cands.length ? cands.map(x => {
