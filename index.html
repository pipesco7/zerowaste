/* =====================================================================
   A. CARGA MASIVA POR FOTO DE BOLETA (fechas estimadas)
   - En claude.ai la foto la lee Claude (capacidad "sample" con imágenes).
   - Fuera de claude.ai se usa OCR local (Tesseract, español).
   - También se puede pegar el texto de la boleta.
   ===================================================================== */
const RECEIPT_WARNING = '⚠️ Nota: Esta función te permite cargar tus compras mucho más rápido. Ten en cuenta que las fechas de vencimiento son estimadas por el sistema y no son exactas; te recomendamos verificar los productos de menor duración.';
const CAT_DAYS = { 'Carbohidratos':180, 'Legumbres':365, 'Proteínas':3, 'Lácteos y derivados':10, 'Verduras y Hortalizas':7, 'Frutas':7, 'Otros':30 };
// Abreviaturas típicas de boletas chilenas
const RECEIPT_ABBR = [[/\bent\b/g,'entera'],[/\bdesc\b/g,'descremada'],[/\bsemid\b/g,'semidescremada'],[/\bpech\b/g,'pechuga'],
  [/\bdesh\b/g,'deshuesada'],[/\bmol\b/g,'molida'],[/\bvac\b/g,'vacuno'],[/\bqso\b/g,'queso'],[/\byogh?\b/g,'yogur'],[/\bmant\b/g,'mantequilla'],
  [/\btom\b/g,'tomate'],[/\bceb\b/g,'cebolla'],[/\bzanah\b/g,'zanahoria'],[/\bplat\b/g,'platano'],[/\bmanz\b/g,'manzana'],[/\blech\b/g,'lechuga'],
  [/\bfid\b/g,'fideos'],[/\bspag\b/g,'spaghetti'],[/\bhna\b/g,'harina'],[/\bazuc\b/g,'azucar'],[/\bacei\b/g,'aceite'],[/\blent\b/g,'lentejas'],
  [/\bgarb\b/g,'garbanzos'],[/\bpor\b/g,'porotos'],[/\bmarraq\b/g,'marraqueta'],[/\bhvo?s?\b/g,'huevos']];
const RECEIPT_SKIP = /total|subtotal|iva|neto|rut|boleta|factura|fecha|hora|caja|cajero|vuelto|efectivo|tarjeta|debito|credito|descuento|ahorro|redcompra|transbank|gracias|direccion|sucursal|cliente|puntos|propina|bolsa|cupon|folio|timbre|sii|www|tel/;
const receipt = { items: [] };

function openReceipt(){
  openSheet(`<h2>🧾 Cargar compras desde la boleta</h2>
    <div class="warn-banner" role="note">${esc(RECEIPT_WARNING)}</div>
    <div style="display:grid;gap:8px;margin-top:12px">
      <button class="btn primary block" data-act="receiptCam">${ICON.camera} Tomar foto de la boleta</button>
      <button class="btn block" data-act="receiptGallery">Elegir foto de la galería</button>
    </div>
    <label class="f">O pega el texto de tu boleta (o de la boleta electrónica del correo)</label>
    <textarea class="input" id="receiptText" placeholder="LECHE ENT COLUN 1L   1.190&#10;ARROZ G2 TUCAPEL 1KG  1.650&#10;TOMATE KG 1,2  1.790"></textarea>
    <button class="btn block" style="margin-top:8px" data-act="receiptParseText">Leer texto</button>
    <div class="muted" id="receiptStatus" style="margin-top:10px">Consejo: foto derecha, con buena luz y la boleta completa.</div>`);

/** Normaliza una línea de boleta y la convierte en un producto (o null si no es un alimento). */
function parseReceiptLine(line){
  let n = norm(line).replace(/[*#|]/g, ' ');
  if (n.replace(/[^a-z]/g, '').length < 3 || RECEIPT_SKIP.test(n)) return null;
  const size = parseQtyString(n, null, null);               // "1l", "1kg", "500g"
  const count = +((n.match(/\b(\d+)\s*x\b/) || [])[1] || 1);   // "2 X YOGHURT"
  n = n.replace(/\$?\s?\d{1,3}(?:[.,]\d{3})+\b/g, ' ')       // precios 1.190
       .replace(/\b\d{6,}\b/g, ' ')                           // códigos
       .replace(/\b\d+\s*x\b/g, ' ')                          // "2 x"
       .replace(/[^a-zñ0-9 ,.]/g, ' ').replace(/\s+/g, ' ').trim();
  RECEIPT_ABBR.forEach(([re, w]) => n = n.replace(re, w));
  const name = n.replace(/\b\d+([.,]\d+)?\s*(kg|g|gr|l|lt|ml|cc|un|u)?\b/g, '').replace(/\s+/g, ' ').trim();
  if (name.replace(/[^a-z]/g, '').length < 3) return null;
  return receiptItem(name, size && size[1] !== 'u' || (size && size[0] > 1) ? size : null, count);
}
/** Crea el ítem de revisión con categoría, ubicación y fecha ESTIMADA. */
function receiptItem(name, size, count = 1){
  const ac = autoCategorize(name);
  const info = ac.catalog;
  let qty = 1, unit = info ? info.unit : 'u';
  if (size){ [qty, unit] = size; if (info && unit !== info.unit){ qty = Math.round(conv(qty, unit, info.unit, info.key) * 100) / 100; unit = info.unit; } }
  else if (info && info.unit !== 'u' && PRICE_REF[info.key]) qty = PRICE_REF[info.key][0];
  qty *= count;
  if (unit === 'u') qty = Math.max(1, Math.round(qty));
  const cat = ac.category || 'Otros';
  const days = info ? info.days : (CAT_DAYS[cat] || 30);
  const pretty = info ? (cap(name).length > 34 ? info.name : cap(name)) : cap(name);
  return { id: uid(), name: pretty, key: ac.key, category: cat, location: ac.location || 'Despensa', qty, unit,
           expiry: addDays(todayISO(), days), days, include: !!info };
}
function receiptFromText(text){
  const seen = new Set(), items = [];
  String(text).split(/\r?\n/).forEach(l => {
    const it = parseReceiptLine(l);
    if (!it) return;
    const k = it.key || norm(it.name);
    if (seen.has(k)){ const prev = items.find(x => (x.key || norm(x.name)) === k); if (prev && prev.unit === 'u') prev.qty += 1; return; }
    seen.add(k); items.push(it);
  });
  return items;
}
/** Lee la foto: Claude dentro de claude.ai, OCR local fuera. */
async function receiptFromPhoto(file){
  const st = t => { const e = $('#receiptStatus'); if (e) e.textContent = t; };
  if (EMBEDDED_VIEW){
    const sample = await window.claude.use('sample').catch(() => null);
    const lim = sample ? await sample.limits().catch(() => null) : null;
    if (!lim?.images) throw { code:'images_unavailable' };
    st('Leyendo la boleta con IA… (puede tardar unos segundos)');
    let img = file;
    if (!lim.images.mediaTypes?.includes(file.type) || (lim.images.maxInputBytes && file.size > lim.images.maxInputBytes)){
      const c = await readImage(file, 2000); img = await new Promise(r => c.toBlob(r, 'image/jpeg', .9));
    }
    const data = await sample.json(
      'Esta imagen es una boleta de supermercado de Chile. Lista SOLO los alimentos y bebidas comprados (ignora bolsas, ' +
      'artículos de aseo, descuentos, totales e impuestos). Expande las abreviaturas (ej. "LECHE ENT" = "Leche entera"). ' +
      'Responde solo con JSON: [{"nombre":"Leche entera","cantidad":1,"unidad":"L"}] donde unidad es una de: u, kg, g, L, ml.',
      { images: img });
    const list = Array.isArray(data) ? data : (data?.items || []);
    return list.filter(x => x && x.nombre).map(x => {
      const q = parseFloat(String(x.cantidad).replace(',', '.')) || 1;
      const size = normUnit(q, x.unidad || 'u');
      return receiptItem(String(x.nombre).slice(0, 60), size[1] === 'u' && size[0] === 1 ? null : size);
    });
  }
  st('Leyendo la boleta (OCR)…');
  await loadScript(TESSERACT_URL);
  const canvas = await readImage(file, 2200);
  const w = await Tesseract.createWorker('spa');
  const { data } = await w.recognize(preprocess(canvas)); await w.terminate();
  return receiptFromText(data.text);
}

function onbAction(act, v){
  const d = onb.data;
  if ($('#onbName')) d.name = $('#onbName').value.trim();
  if ($('#onbCustom')) d.customRestrictions = $('#onbCustom').value.trim();
  if (act === 'meal'){ d.meals = d.meals.includes(v) ? d.meals.filter(x => x !== v) : ALL_MEALS.filter(m => d.meals.includes(m) || m === v); }
  if (act === 'people') d.people = Math.min(20, Math.max(1, d.people + +v));
  if (act === 'pref') d.preference = v;
  if (act === 'cond'){
    d.conditions = d.conditions.includes(v) ? d.conditions.filter(x => x !== v) : [...d.conditions, v];
  }
  if (act === 'demo') onb.demo = !onb.demo;
  if (act === 'back') onb.step--;
  if (act === 'cancel'){ $('#onb').classList.remove('show'); return; }
  if (act === 'next'){
    if (onb.step === 1 && !d.meals.length) return toast('Selecciona al menos una comida');
    if (onb.step < 4){ onb.step++; }
    else { finishOnboarding(); return; }
  }
  renderOnb();
}
function finishOnboarding(){
  S.profile = Object.assign(S.profile, onb.data);
  if (!S.profile.familyCode) S.profile.familyCode = genFamilyCode();
  const first = !S.onboarded;
  S.onboarded = true;
  if (first && onb.demo) loadDemo(false);
  generateMenu(true);
  save();
  $('#onb').classList.remove('show');
  toast(first ? '¡Listo! Tu menú semanal fue generado' : 'Perfil actualizado · menú adaptado');
  go(first ? 'home' : current);
}
function genFamilyCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const arr = new Uint8Array(6); (crypto.getRandomValues ? crypto.getRandomValues(arr) : arr.forEach((_, i) => arr[i] = Math.random() * 256));
  return 'ZW-' + [...arr].map(n => chars[n % chars.length]).join('');
}

/* ---------------------------------------------------------------------
   BASE DE PRODUCTOS PROPIA (CSV) → S.barcodes, que el escáner consulta primero.
   --------------------------------------------------------------------- */
const PRODUCTS_HEADER = ['codigo','nombre','marca','cantidad','unidad','categoria','ubicacion'];
const PRODUCTS_TEMPLATE = PRODUCTS_HEADER.join(',') + '\n' +
  '7800000000016,Leche entera 1 L (EJEMPLO),Marca ejemplo,1,L,,\n' +
  '7800000000023,Arroz grado 2 1 kg (EJEMPLO),Marca ejemplo,1,kg,,\n' +
  '7800000000030,Atún en agua 160 g (EJEMPLO),Marca ejemplo,1,u,Proteínas,Despensa\n';
const csvCell = v => /[",\n;]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
function parseCSV(text){
  const first = text.split(/\r?\n/)[0] || '';
  const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"' && text[i + 1] === '"'){ cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep){ row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function importProductsCSV(text){
  const rows = parseCSV(text.replace(/^﻿/, ''));
  if (!rows.length) return { ok:0, bad:0 };
  const head = rows[0].map(h => norm(h));
  const hasHeader = head.includes('codigo') || head.includes('nombre');
  const col = name => { const i = head.indexOf(name); return hasHeader ? i : PRODUCTS_HEADER.indexOf(name); };
  let ok = 0, bad = 0;
  (hasHeader ? rows.slice(1) : rows).forEach(r => {
    const get = n => { const i = col(n); return i >= 0 ? String(r[i] || '').trim() : ''; };
    const code = get('codigo').replace(/\D/g, ''), name = get('nombre');
    if (!/^\d{6,14}$/.test(code) || !name){ bad++; return; }
    const ac = autoCategorize(name);
    const q = parseFloat(get('cantidad').replace(',', '.'));
    const [qty, unit] = q > 0 ? normUnit(q, get('unidad') || 'u') : [ac.catalog && ac.catalog.unit !== 'u' && PRICE_REF[ac.key] ? PRICE_REF[ac.key][0] : 1, ac.catalog ? ac.catalog.unit : 'u'];
    const category = CATEGORIES.find(c => norm(c) === norm(get('categoria'))) || ac.category || 'Otros';
    const location = LOCATIONS.find(l => norm(l) === norm(get('ubicacion'))) || ac.location || 'Despensa';
    S.barcodes[code] = { name, brand: get('marca'), key: ac.key, category, location, qty, unit };
    ok++;
  });
  save();
  return { ok, bad };
}
/** Guarda un archivo: capacidad "downloads" en claude.ai, enlace de descarga fuera. */
async function saveTextFile(filename, text, type){
  const blob = new Blob([text], { type });
  const dl = window.claude?.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl){ try{ await dl.save({ filename, data: blob }); toast('Archivo guardado'); }catch(e){ toast(e?.code === 'declined' ? 'Descarga cancelada' : 'No se pudo descargar aquí'); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Archivo descargado');
}

  const f = e.target.files[0]; e.target.value = ''; if (!f) return;

    render();
    toast(ok ? `${ok} producto(s) importados${bad ? ` · ${bad} fila(s) con código o nombre inválido` : ''}` : 'No se encontraron filas válidas (revisa las columnas codigo y nombre)');
